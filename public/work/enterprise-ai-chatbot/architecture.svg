    <circle cx="500" cy="262" r="9" fill="#2a2117" stroke="#5a4520"/><text x="500" y="266" text-anchor="middle" font-size="10" fill="#fbbf24">2</text><text x="518" y="266">retrieve context + alerts</text>
    <circle cx="500" cy="290" r="9" fill="#2a2117" stroke="#5a4520"/><text x="500" y="294" text-anchor="middle" font-size="10" fill="#fbbf24">3</text><text x="518" y="294">inject persona (v11)</text>
    <circle cx="500" cy="318" r="9" fill="#2a2117" stroke="#5a4520"/><text x="500" y="322" text-anchor="middle" font-size="10" fill="#fbbf24">4</text><text x="518" y="322">call model</text>
    <circle cx="500" cy="346" r="9" fill="#2a2117" stroke="#5a4520"/><text x="500" y="350" text-anchor="middle" font-size="10" fill="#fbbf24">5</text><text x="518" y="350">enforce alert override</text>
  </g>

