  <rect x="44" y="640" width="160" height="60" rx="12" fill="url(#card)" stroke="#2a2a36"/>
  <rect x="58" y="655" width="26" height="26" rx="7" fill="#1f6feb"/><text x="71" y="674" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">D</text>
  <text x="94" y="666" font-size="12.5" font-weight="600" fill="#e9eaee">Google Drive</text><text x="94" y="683" font-size="10" fill="#8a8f99">alert docs (.txt)</text>

  <rect x="244" y="640" width="262" height="60" rx="12" fill="url(#card)" stroke="#2a2a36"/>
  <rect x="258" y="655" width="26" height="26" rx="7" fill="#f59e0b"/><text x="271" y="674" text-anchor="middle" font-size="11" font-weight="700" fill="#241400">n8</text>
  <text x="294" y="666" font-size="12.5" font-weight="600" fill="#e9eaee">n8n ingest flow</text><text x="294" y="683" font-size="10" fill="#8a8f99">trigger · filter · switch · edit fields</text>

  <rect x="546" y="640" width="170" height="60" rx="12" fill="url(#card)" stroke="#2a2a36"/>
  <rect x="560" y="655" width="26" height="26" rx="7" fill="#93c5fd"/><text x="573" y="674" text-anchor="middle" font-size="12" font-weight="700" fill="#0a1f3a">C</text>
  <text x="596" y="666" font-size="12.5" font-weight="600" fill="#e9eaee">Cohere</text><text x="596" y="683" font-size="10" fill="#8a8f99">embeddings</text>
  <path class="fg" d="M204 670 L240 670" marker-end="url(#mg)"/>
