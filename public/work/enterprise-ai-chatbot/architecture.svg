  <line x1="980" y1="86" x2="1022" y2="86" class="fg"/><text x="1030" y="90" font-size="12.5" fill="#9aa0aa">ingestion</text>

  <!-- section pill RUNTIME -->
  <rect x="44" y="128" width="96" height="26" rx="13" fill="#1b1b26" stroke="#2e2e3a"/>
  <circle cx="60" cy="141" r="4" fill="#818cf8"/><text x="72" y="145" font-size="11" font-weight="700" letter-spacing="1.5" fill="#a5abb8">RUNTIME</text>

  <!-- USER -->
  <rect x="44" y="172" width="174" height="188" rx="16" fill="url(#card)" stroke="#2a2a36"/>
  <rect x="60" y="188" width="30" height="30" rx="8" fill="#1f6feb"/><text x="75" y="209" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">U</text>
