  <text x="94" y="546" font-size="12.5" font-weight="600" fill="#e9eaee">YouTube</text><text x="94" y="563" font-size="10" fill="#8a8f99">channel videos</text>

  <rect x="244" y="520" width="262" height="60" rx="12" fill="url(#card)" stroke="#2a2a36"/>
  <rect x="258" y="535" width="26" height="26" rx="7" fill="#3776ab"/><text x="271" y="554" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Py</text>
  <text x="294" y="546" font-size="12.5" font-weight="600" fill="#e9eaee">Python ETL</text><text x="294" y="563" font-size="10" fill="#8a8f99">scrape · chunk · dual-translate · embed</text>
