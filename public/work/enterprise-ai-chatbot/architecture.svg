  <rect x="808" y="186" width="26" height="26" rx="7" fill="#a78bfa"/><text x="821" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#1a0f33">AI</text>
  <text x="844" y="196" font-size="13" font-weight="700" fill="#c4b5fd">LLM · OpenRouter</text><text x="844" y="214" font-size="10.5" fill="#8a8f99">gpt-4o-mini</text>

  <rect x="792" y="244" width="226" height="56" rx="12" fill="url(#card)" stroke="#1f5c45"/>
  <rect x="808" y="258" width="26" height="26" rx="7" fill="#34d399"/><text x="821" y="277" text-anchor="middle" font-size="12" font-weight="700" fill="#04231a">V</text>
  <text x="844" y="268" font-size="13" font-weight="700" fill="#34d399">Upstash Vector</text><text x="844" y="286" font-size="10.5" fill="#8a8f99">knowledge base · 50h media</text>

  <rect x="792" y="316" width="226" height="56" rx="12" fill="url(#card)" stroke="#28507e"/>
  <rect x="808" y="330" width="26" height="26" rx="7" fill="#60a5fa"/><text x="821" y="349" text-anchor="middle" font-size="12" font-weight="700" fill="#04223f">P</text>
  <text x="844" y="340" font-size="13" font-weight="700" fill="#60a5fa">Pinecone</text><text x="844" y="358" font-size="10.5" fill="#8a8f99">live alerts · Cohere embeds</text>

