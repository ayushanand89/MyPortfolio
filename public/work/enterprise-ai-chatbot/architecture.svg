<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0c14"/><stop offset="100%" stop-color="#08080c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.20"/><stop offset="60%" stop-color="#4338ca" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a24"/><stop offset="100%" stop-color="#101017"/>
    </linearGradient>
    <linearGradient id="n8ncard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241a10"/><stop offset="100%" stop-color="#15110b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .f  { stroke:#6b7280; stroke-width:2.2; fill:none; stroke-dasharray:9 7; animation:d .9s linear infinite; }
      .fb { stroke:#818cf8; stroke-width:2.4; fill:none; stroke-dasharray:9 7; animation:d .9s linear infinite; }
      .fg { stroke:#34d399; stroke-width:2.2; fill:none; stroke-dasharray:9 7; animation:d 1.1s linear infinite; }
      @keyframes d { to { stroke-dashoffset:-16 } }
    </style>
    <marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#8b93a7"/></marker>
    <marker id="mb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#818cf8"/></marker>
    <marker id="mg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#34d399"/></marker>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#glow)"/>

  <!-- title -->
