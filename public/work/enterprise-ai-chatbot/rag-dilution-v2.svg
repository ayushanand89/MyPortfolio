<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0c0c14"/><stop offset="100%" stop-color="#08080c"/></linearGradient>
    <linearGradient id="racc" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <rect width="1280" height="760" fill="url(#rbg)"/>
  <rect x="52" y="40" width="36" height="6" rx="3" fill="url(#racc)"/>
  <text x="52" y="84" font-size="30" font-weight="800" fill="#f4f4f7">Semantic dilution, and the fix</text>
  <text x="52" y="112" font-size="15" fill="#9aa0ac">Same query. "How do I backtest a strategy?"</text>

  <!-- LEFT: naive -->
  <rect x="52" y="150" width="560" height="560" rx="18" fill="#13131b" stroke="#3a2330"/>
  <text x="80" y="196" font-size="18" font-weight="700" fill="#f87171">Naive · search by keyword</text>
  <text x="80" y="220" font-size="13" fill="#9aa0ac">Repeated themes inflate generic chunks</text>
  <g font-size="16">
    <!-- rows -->
    <g>
      <rect x="80" y="244" width="504" height="56" rx="10" fill="#1a1420" stroke="#3a2330"/>
      <text x="100" y="270" fill="#e9eaee" font-weight="600">1 · "trading basics"</text>
      <text x="100" y="290" fill="#8a8f99" font-size="13">generic clip</text>
      <text x="500" y="278" fill="#f87171" font-weight="700">0.83</text>
      <text x="548" y="278" fill="#f87171" font-weight="700">✕</text>
    </g>
    <g>
      <rect x="80" y="310" width="504" height="50" rx="10" fill="#161620" stroke="#2a2a36"/>
      <text x="100" y="341" fill="#cdd3e0" font-weight="600">2 · "my whole strategy"</text>
      <text x="500" y="341" fill="#9aa0ac" font-weight="700">0.81</text>
    </g>
    <g>
      <rect x="80" y="370" width="504" height="50" rx="10" fill="#161620" stroke="#2a2a36"/>
      <text x="100" y="401" fill="#cdd3e0" font-weight="600">3 · "reading the market"</text>
      <text x="500" y="401" fill="#9aa0ac" font-weight="700">0.79</text>
    </g>
    <text x="100" y="452" fill="#6b7280" font-size="22" letter-spacing="3">· · ·</text>
    <g>
      <rect x="80" y="470" width="504" height="64" rx="10" fill="#1a1420" stroke="#5a3340"/>
      <text x="100" y="498" fill="#fca5a5" font-weight="700">6 · Backtesting tutorial</text>
      <text x="100" y="518" fill="#8a8f99" font-size="13">the actual answer, buried</text>
      <text x="500" y="508" fill="#fca5a5" font-weight="700">0.71</text>
      <text x="540" y="508" fill="#f87171" font-size="13">↓ rank 6</text>
    </g>
    <text x="80" y="586" fill="#9aa0ac" font-size="15">Top-k only sees the noise. The specific answer never makes the cut.</text>
  </g>

  <!-- arrow -->
  <text x="636" y="440" text-anchor="middle" font-size="34" fill="#a78bfa">→</text>

  <!-- RIGHT: fix -->
  <rect x="668" y="150" width="560" height="560" rx="18" fill="#13131b" stroke="#1f4636"/>
  <text x="696" y="196" font-size="18" font-weight="700" fill="#34d399">Fix · full question + HyDE</text>
  <text x="696" y="220" font-size="13" fill="#9aa0ac">Search with a hypothetical ideal answer, not a keyword</text>
  <g font-size="16">
    <g>
      <rect x="696" y="244" width="504" height="64" rx="10" fill="#10231b" stroke="#1f5c45"/>
      <text x="716" y="272" fill="#6ee7b7" font-weight="700">1 · Backtesting tutorial</text>
      <text x="716" y="292" fill="#8a8f99" font-size="13">the right clip, now on top</text>
      <text x="1116" y="282" fill="#34d399" font-weight="700">0.88</text>
      <text x="1164" y="282" fill="#34d399" font-weight="700">✓</text>
    </g>
    <g>
      <rect x="696" y="318" width="504" height="50" rx="10" fill="#161620" stroke="#2a2a36"/>
      <text x="716" y="349" fill="#cdd3e0" font-weight="600">2 · "my whole strategy"</text>
      <text x="1116" y="349" fill="#9aa0ac" font-weight="700">0.74</text>
    </g>
    <g>
      <rect x="696" y="378" width="504" height="50" rx="10" fill="#161620" stroke="#2a2a36"/>
      <text x="716" y="409" fill="#cdd3e0" font-weight="600">3 · "trading basics"</text>
      <text x="1116" y="409" fill="#9aa0ac" font-weight="700">0.70</text>
    </g>
    <text x="716" y="476" fill="#e9eaee" font-size="16" font-weight="600">+ verify the index first.</text>
    <text x="716" y="502" fill="#9aa0ac" font-size="15">My worst "wrong answer" wasn't a bad prompt:</text>
    <text x="716" y="524" fill="#9aa0ac" font-size="15">the document had never been ingested.</text>
    <text x="716" y="568" fill="#34d399" font-size="15" font-weight="600">Retrieval is a data problem before a prompt problem.</text>
  </g>
</svg>
