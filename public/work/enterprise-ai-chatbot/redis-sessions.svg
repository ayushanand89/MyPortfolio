<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="zbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0c0c14"/><stop offset="100%" stop-color="#08080c"/></linearGradient>
    <linearGradient id="zacc" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
    <marker id="zm" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#8b93a7"/></marker>
  </defs>
  <rect width="1280" height="760" fill="url(#zbg)"/>
  <rect x="52" y="40" width="36" height="6" rx="3" fill="url(#zacc)"/>
  <text x="52" y="84" font-size="30" font-weight="800" fill="#f4f4f7">Why Redis: isolated, hot, per-user state</text>
  <text x="52" y="112" font-size="15" fill="#9aa0ac">2,000+ conversations that never cross wires</text>

  <!-- users -->
  <g>
    <rect x="60" y="190" width="190" height="64" rx="14" fill="#13131b" stroke="#2a2a36"/>
    <circle cx="92" cy="222" r="15" fill="#1f6feb"/><text x="92" y="227" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">A</text>
    <text x="118" y="219" font-size="14" font-weight="600" fill="#e9eaee">User A</text><text x="118" y="237" font-size="11" fill="#8a8f99">asks about Gold</text>
    <rect x="60" y="348" width="190" height="64" rx="14" fill="#13131b" stroke="#2a2a36"/>
    <circle cx="92" cy="380" r="15" fill="#a855f7"/><text x="92" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">B</text>
    <text x="118" y="377" font-size="14" font-weight="600" fill="#e9eaee">User B</text><text x="118" y="395" font-size="11" fill="#8a8f99">asks about BTC</text>
    <rect x="60" y="506" width="190" height="64" rx="14" fill="#13131b" stroke="#2a2a36"/>
    <circle cx="92" cy="538" r="15" fill="#10b981"/><text x="92" y="543" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">C</text>
    <text x="118" y="535" font-size="14" font-weight="600" fill="#e9eaee">User C</text><text x="118" y="553" font-size="11" fill="#8a8f99">asks about ETH</text>
  </g>

  <!-- app / n8n -->
  <rect x="470" y="320" width="180" height="120" rx="16" fill="#161313" stroke="#f59e0b"/>
  <text x="560" y="372" text-anchor="middle" font-size="16" font-weight="700" fill="#fbbf24">App + Agent</text>
  <text x="560" y="396" text-anchor="middle" font-size="12" fill="#9aa0ac">stateless</text>
  <text x="560" y="414" text-anchor="middle" font-size="12" fill="#9aa0ac">passes sessionId</text>

  <!-- arrows users->app -->
  <path d="M250 222 C 360 222, 380 360, 466 360" fill="none" stroke="#5b6472" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#zm)"/>
  <path d="M250 380 L466 380" fill="none" stroke="#5b6472" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#zm)"/>
  <path d="M250 538 C 360 538, 380 400, 466 400" fill="none" stroke="#5b6472" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#zm)"/>

  <!-- Redis -->
  <rect x="860" y="170" width="360" height="420" rx="18" fill="#13131b" stroke="#7f3030"/>
  <rect x="884" y="194" width="30" height="30" rx="8" fill="#ef4444"/><text x="899" y="215" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">R</text>
  <text x="924" y="206" font-size="18" font-weight="700" fill="#f87171">Upstash Redis</text>
  <text x="924" y="224" font-size="12" fill="#9aa0ac">one key per user · sub-ms reads</text>

  <g>
    <rect x="884" y="250" width="312" height="90" rx="12" fill="#1a1418" stroke="#3a2a2e"/>
    <text x="904" y="280" font-size="14" font-weight="700" fill="#fca5a5" font-family="ui-monospace,monospace">session:A</text>
    <text x="904" y="304" font-size="12.5" fill="#cbd5e1">{ topic: "Gold", turns: 6 }</text>
    <text x="904" y="324" font-size="11.5" fill="#8a8f99">isolated context</text>

    <rect x="884" y="350" width="312" height="90" rx="12" fill="#1a1418" stroke="#3a2a2e"/>
    <text x="904" y="380" font-size="14" font-weight="700" fill="#d8b4fe" font-family="ui-monospace,monospace">session:B</text>
    <text x="904" y="404" font-size="12.5" fill="#cbd5e1">{ topic: "BTC", turns: 3 }</text>
    <text x="904" y="424" font-size="11.5" fill="#8a8f99">isolated context</text>

    <rect x="884" y="450" width="312" height="90" rx="12" fill="#1a1418" stroke="#3a2a2e"/>
    <text x="904" y="480" font-size="14" font-weight="700" fill="#6ee7b7" font-family="ui-monospace,monospace">session:C</text>
    <text x="904" y="504" font-size="12.5" fill="#cbd5e1">{ topic: "ETH", turns: 9 }</text>
    <text x="904" y="524" font-size="11.5" fill="#8a8f99">isolated context</text>
  </g>

  <!-- app->redis -->
  <path d="M650 360 C 740 360, 760 380, 856 380" fill="none" stroke="#34d399" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#zm)"/>
  <text x="752" y="350" text-anchor="middle" font-size="12" fill="#34d399">read/write by sessionId</text>

  <text x="52" y="700" font-size="15" fill="#9aa0ac">Static session handling once let context <tspan fill="#f87171">bleed across users</tspan>. A unique key per user fixed it — fast, isolated, and gone when it should be.</text>
</svg>
